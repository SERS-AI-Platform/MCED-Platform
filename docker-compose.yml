services:
  sers-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sers-analysis
    
    # Mount volumes for data and configuration
    volumes:
      # Input data directory
      - ./data:/data:ro
      # Output results directory
      - ./results:/results:rw
      # Models directory
      - ./models:/models:rw
      # Configuration (override if needed)
      - ./config.yaml:/app/config.yaml:ro
    
    # Environment variables
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - SERS_DATA_DIR=/data
      - SERS_RESULTS_DIR=/results
      - SERS_MODEL_DIR=/models
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "2"
          memory: 2G
    
    # Restart policy for production
    restart: on-failure
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Platform specification (optional, for cross-platform builds)
    platform: linux/amd64

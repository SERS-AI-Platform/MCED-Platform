name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        # Several tests shell out to `uv run <script>` for PEP 723 scripts that
        # declare their own (Python 3.13) dependencies; uv fetches that
        # interpreter itself, independent of the matrix Python above.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1 (no floating v10 tag upstream)
        with:
          enable-cache: true

      - name: Install dependencies
        env:
          # Runners are single-use; caching wheels only doubles disk usage.
          PIP_NO_CACHE_DIR: "1"
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch first: the default PyPI wheel is a CUDA build that
          # pulls ~2.7 GB of nvidia-* libraries the GPU-less runner can't use
          # and that overflowed its disk. Installing it beforehand satisfies
          # the ml extra's torch>=2.0 so "[dev]" doesn't re-resolve it.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Core import smoke check
        run: |
          python - <<'PY'
          import sers
          from sers import (
              find_spectra,
              load_config,
              make_common_grid,
              parse_filename,
              preprocess_spectra,
              read_spectrum,
              run_qc_pipeline,
          )

          print("core import smoke ok")
          PY

      - name: Lint with ruff
        run: |
          ruff check src/ tests/ scripts/quality/

      - name: Type check with mypy
        run: |
          mypy

      - name: Run tests with coverage
        run: |
          # `slow` marks real-data regression tests (gitignored clinical files,
          # untracked publication outputs); they run locally with `pytest -m slow`.
          pytest -m "not slow" --cov=sers --cov-report=term-missing --cov-report=xml --cov-fail-under=35

      - name: Process coverage summary
        run: |
          python scripts/quality/coverage_by_process.py coverage.xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

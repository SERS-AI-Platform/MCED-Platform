{% extends "base.html" %}
{% block page_title %}{{ s.retest_bmi_title }}{% endblock %}

{% block content %}
<div class="card retest-bmi-card">
    <h2 class="card-title">{{ s.retest_bmi_title }}</h2>
    <p class="form-hint retest-bmi-message">{{ s.retest_bmi_message }}</p>
    {% if error_message %}<div class="inline-alert" role="alert">{{ error_message }}</div>{% endif %}
    <form method="POST" action="/patient/{{ session.id }}/retest">
        <div class="form-group">
            <label class="form-label" for="retestBmi">{{ s.bmi }} *</label>
            <input class="form-input" type="number" id="retestBmi" name="bmi"
                   required min="10" max="60" step="0.1" inputmode="decimal"
                   placeholder="{{ s.bmi_placeholder }}">
            <p class="form-hint">{{ s.bmi_optional }}</p>
        </div>
        <div class="action-row">
            <a href="/history" class="btn btn-secondary">{{ s.cancel }}</a>
            <button type="submit" class="btn btn-primary">{{ s.retest_start }}</button>
        </div>
    </form>
</div>
{% endblock %}

{% extends "base.html" %}
{% block page_title %}{{ s.report_ready_title }}{% endblock %}

{% block content %}
<div class="card">
    <h2 class="card-title">{{ s.report_ready_title }}</h2>
    <p>{{ s.report_ready_message }}</p>

    <div class="action-row">
        <a href="/patient/{{ session.id }}/report.pdf" class="btn btn-primary" download>
            {{ s.pdf_download }}
        </a>
        <a href="/patient/{{ session.id }}/report.csv" class="btn btn-secondary" download>
            {{ s.csv_download }}
        </a>
        <a href="/patient/{{ session.id }}/results" class="btn btn-secondary">
            {{ s.back_to_results }}
        </a>
    </div>
    <p class="form-hint">{{ s.download_path_notice }}</p>
</div>
{% endblock %}

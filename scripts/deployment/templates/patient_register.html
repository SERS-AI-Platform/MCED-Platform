{% extends "base.html" %}
{% block page_title %}{{ s.patient_title }}{% endblock %}

{% block content %}
<div class="card">
    <h2 class="card-title">{{ s.patient_title }}</h2>

    {% if error_message %}
    <div class="inline-alert" role="alert">{{ error_message }}</div>
    {% endif %}

    <form method="POST" action="/patient/new" id="patientForm">
        <div class="form-group">
            <label class="form-label" for="patient_id">{{ s.patient_id }} *</label>
            <input type="text" id="patient_id" name="patient_id" class="form-input"
                   required pattern="[A-Za-z0-9_-]+" value="{{ form_values.patient_id|default('') }}"
                   placeholder="예: P20260406-001">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="age">{{ s.age }} *</label>
                <input type="number" id="age" name="age" class="form-input"
                       required min="1" max="120" step="1" value="{{ form_values.age|default('') }}">
            </div>
            <div class="form-group">
                <label class="form-label" for="sex">{{ s.sex }} *</label>
                <select id="sex" name="sex" class="form-select" required onchange="onSexChange()">
                    <option value="">—</option>
                    <option value="M" {% if form_values.sex|default('') == 'M' %}selected{% endif %}>{{ s.male }}</option>
                    <option value="F" {% if form_values.sex|default('') == 'F' %}selected{% endif %}>{{ s.female }}</option>
                </select>
            </div>
        </div>

        <div id="bioNotice" class="bio-notice" style="display:none;">
            <span>&#9432;</span>
            <span id="bioNoticeText"></span>
        </div>

        <div class="form-group" style="margin-top: 20px;">
            <label class="form-label" for="bmi">{{ s.bmi }} *</label>
            <input type="number" id="bmi" name="bmi" class="form-input"
                   required min="10" max="60" step="0.1" inputmode="decimal"
                   aria-describedby="bmiHint" value="{{ form_values.bmi|default('') }}"
                   placeholder="{{ s.bmi_placeholder }}">
            <p class="form-hint" id="bmiHint">{{ s.bmi_optional }}</p>
        </div>

        <div id="modelNotice" class="bio-notice" style="margin-top: 16px;">
            <span>&#9432;</span>
            <span id="modelNoticeText">{{ s.model_display_name }}</span>
        </div>

        <div style="margin-top: 24px;">
            <button type="submit" class="btn btn-primary">{{ s.next }} &#8594;</button>
        </div>
    </form>
</div>

<script>
const bioTexts = {
    M: "{{ s.bio_constraint_male }}",
    F: "{{ s.bio_constraint_female }}"
};

function onSexChange() {
    const sex = document.getElementById('sex').value;
    const notice = document.getElementById('bioNotice');
    if (sex && bioTexts[sex]) {
        notice.style.display = 'flex';
        document.getElementById('bioNoticeText').textContent = bioTexts[sex];
    } else {
        notice.style.display = 'none';
    }
}
</script>
{% endblock %}

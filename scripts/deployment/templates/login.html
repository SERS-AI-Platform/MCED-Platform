{% extends "base.html" %}
{% block page_title %}{{ s.login }}{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-logo">
        <div class="login-logo-icon">S</div>
        <h1 class="login-title">{{ s.app_title }}</h1>
        <p class="login-subtitle">{{ s.app_subtitle }}</p>
    </div>

    {% if error %}
    <div class="login-error">{{ s.login_error }}</div>
    {% endif %}

    <div class="card">
        <form method="POST" action="/login">
            <div class="form-group">
                <label class="form-label" for="username">{{ s.username }}</label>
                <input type="text" id="username" name="username" class="form-input"
                       required autocomplete="username" autofocus>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">{{ s.password }}</label>
                <input type="password" id="password" name="password" class="form-input"
                       required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary">{{ s.login_submit }}</button>
        </form>

        <div style="text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-secondary);">
            {{ s.no_account }}
            <a href="/register" style="color: var(--accent); text-decoration: none; font-weight: 600;">{{ s.register }}</a>
        </div>
        <div style="text-align: center; margin-top: 8px; font-size: 12px; color: var(--text-muted);">
            {{ s.password_reset_notice }}
        </div>
    </div>
</div>
{% endblock %}

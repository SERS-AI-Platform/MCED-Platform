[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sers-analysis"
version = "0.1.0"
description = "SERS spectral analysis pipeline for cancer screening"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.10"
authors = [
    {name = "SOLUM Healthcare"}
]
keywords = ["SERS", "spectroscopy", "cancer screening", "metabolomics"]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "click>=8.1",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
]
ml = [
    "xgboost",
    "lightgbm",
]
viz = [
    "matplotlib>=3.7",
    "seaborn",
]
all = [
    "sers-analysis[dev,ml,viz]",
]

[project.scripts]
sers = "sers.cli:cli"

[project.urls]
Homepage = "https://github.com/SERS-AI-Platform/MCED-Platform"
Documentation = "https://github.com/SERS-AI-Platform/MCED-Platform#readme"
Repository = "https://github.com/SERS-AI-Platform/MCED-Platform.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Pragmatic ruleset for a research codebase (relaxed 2026-06):
# keep real-bug (F), import-order (I), whitespace (W) and core style (E);
# drop docstring (D) and naming (N) enforcement; ignore noisy, unfixable
# style rules. Tighten over time as the team matures.
select = ["E", "F", "I", "W"]
ignore = ["E501", "E402", "E701", "E722"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests that need real files or are slow (deselect with '-m \"not slow\"')",
]

[tool.mypy]
python_version = "3.10"
files = [
    "src/sers/config.py",
    "src/sers/scoring.py",
    "src/sers/cli",
]
mypy_path = "src"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

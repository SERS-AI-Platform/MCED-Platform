[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sers-analysis"
version = "0.1.0"
description = "SERS spectral analysis pipeline for cancer screening"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "SOLUM Healthcare"}
]
keywords = ["SERS", "spectroscopy", "cancer screening", "metabolomics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
]
ml = [
    "xgboost",
    "lightgbm",
]
viz = [
    "matplotlib>=3.7",
    "seaborn",
]
all = [
    "sers-analysis[dev,ml,viz]",
]

[project.scripts]
sers = "sers.cli:main"

[project.urls]
Homepage = "https://github.com/solum-healthcare/sers-analysis"
Documentation = "https://github.com/solum-healthcare/sers-analysis#readme"
Repository = "https://github.com/solum-healthcare/sers-analysis.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests that need real files or are slow (deselect with '-m \"not slow\"')",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

name: sers-analysis
channels:
  - conda-forge
  - defaults

dependencies:
  # Core
  - python>=3.10
  - numpy>=1.24
  - pandas>=2.0
  - pyyaml>=6.0
  
  # Signal Processing
  - scipy>=1.10
  
  # Machine Learning
  - scikit-learn>=1.3
  - xgboost
  - lightgbm
  
  # Visualization
  - matplotlib>=3.7
  - seaborn
  
  # Development
  - pytest>=7.0
  - pytest-cov
  - ruff
  - mypy
  
  # Jupyter (optional)
  - jupyterlab
  - ipykernel
  
  # Install package in editable mode
  - pip
  - pip:
    - -e .
